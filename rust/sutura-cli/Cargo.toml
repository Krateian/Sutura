[package]
name = "sutura-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Sutura command-line entry point"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krateian/Sutura"

[[bin]]
name = "sutura"
path = "src/main.rs"

[dependencies]
sutura-core = { path = "../sutura-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
