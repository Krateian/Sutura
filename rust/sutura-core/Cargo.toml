[package]
name = "sutura-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Python-free Sutura repair core (mesh types, I/O, pipeline)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krateian/Sutura"

[lib]
name = "sutura_core"
path = "src/lib.rs"

[dependencies]
sutura-geom = { path = "../sutura-geom", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
