[package]
name = "sutura-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Python-free Sutura repair core (mesh types, I/O, pipeline)"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Krateian/Sutura"

[lib]
name = "sutura_core"
path = "src/lib.rs"

[dependencies]
sutura-geom = { path = "../sutura-geom", default-features = false, features = ["decimate"] }
# zip 9's `deflate` feature enables `deflate-zopfli`, whose output differs from
# zlib's — and our 3MF writer must stay byte-identical to Python's zipfile, which
# uses zlib. `deflate-flate2-zlib-rs` is the flate2/zlib-rs path alone: same
# compressed bytes as before the upgrade, without zopfli.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = "0.8"
sha2 = "0.11"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
flate2 = "1.1.11"
