[package]
name = "sutura-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Thin PyO3 bridge over sutura-core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krateian/Sutura"

[lib]
name = "sutura_core_py"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]
default = []

[dependencies]
sutura-core = { path = "../sutura-core" }
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
numpy = "=0.29.0"
