[package]
name = "sutura-geom"
version = "0.1.0"
edition = "2021"
description = "Foundation crate for Sutura's future indirect-predicates geometry core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krateian/Sutura"

[lib]
name = "sutura_geom"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]
default = []

[dependencies]
robust = "=1.2.0"
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
numpy = "=0.29.0"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
rand = "0.8"