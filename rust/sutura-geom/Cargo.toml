[package]
name = "sutura-geom"
version = "0.1.0"
edition = "2021"
description = "Foundation crate for Sutura's future indirect-predicates geometry core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krateian/Sutura"

[lib]
name = "sutura_geom"
crate-type = ["cdylib", "rlib"]

[features]
profile = []
cdt-diag = []
# Cross-checks every accelerated CDT query against the linear reference
# scan (slow; differential testing only).
cdt-check = []
extension-module = ["pyo3/extension-module"]
default = []

[dependencies]
robust = "=1.2.0"
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
numpy = "=0.29.0"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
# Pure-Rust data-parallelism for the morphology grids. No C/system
# dependency; ~1.1 MB of source in the lockfile (rayon + rayon-core +
# crossbeam-deque/epoch + either), MIT OR Apache-2.0.
rayon = "1.12"
# The same C++ Manifold kernel the Python manifold3d package uses, called
# in-process for Stage 2, outer-shell union, repeated-element CSG and the
# Graft local stitch. Static link, no TBB (sequential, deterministic).
manifold-csg = { version = "=0.4.1", default-features = false }
# Sparse direct LU for the Flap fairing normal-equation system.
# Pure Rust, MIT; no C/LAPACK/system dependency in the default build.
faer = { version = "0.24", features = ["sparse-linalg"] }
# Point-cloud nearest-neighbour queries (replaces scipy.spatial.cKDTree).
# Pure Rust, MIT OR Apache-2.0; MSRV 1.89.
kiddo = "6.3"

[build-dependencies]
# Compiles the vendored Geogram Delaunay PSM (C++20). Build tool only.
cc = "1"

[dev-dependencies]
rand = "0.8"