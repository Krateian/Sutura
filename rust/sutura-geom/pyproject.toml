[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "sutura-geom"
version = "0.1.0"
description = "Foundation crate for Sutura's future indirect-predicates geometry core"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }

[tool.maturin]
module-name = "sutura_geom"
features = ["extension-module"]
include = [
  "THIRD_PARTY.md",
  "third_party/geogram_delaunay_psm/LICENSE",
  "third_party/meshoptimizer/LICENSE",
]