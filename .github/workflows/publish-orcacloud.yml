name: Publish to OrcaCloud

# Fires on EVERY GitHub Release, not just plugin-specific ones -- this repo's
# standing release checklist already tags + publishes a Release for every
# Sutura version, so no separate plugin-only release step is needed. The
# plugin's OrcaCloud version now simply follows Sutura's own release tag.
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  # Space-separated globs matching the plugin files to upload (.whl / .py).
  PLUGIN_FILES: "orcaslicer-plugin/sutura_repair_linux_x86_64.py"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Skip if the plugin itself did not change in this release
        id: check
        run: |
          set -euo pipefail
          current_tag="$GITHUB_REF_NAME"
          prev_tag="$(git tag --sort=creatordate | awk -v cur="$current_tag" '$0==cur{print prev; found=1} {prev=$0} END{if(!found) print ""}')"
          if [ -z "$prev_tag" ]; then
            echo "No earlier tag found -- publishing unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev_tag" "$current_tag" -- $PLUGIN_FILES; then
            echo "Plugin files unchanged since $prev_tag -- skipping OrcaCloud publish for $current_tag."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Plugin files changed since $prev_tag -- publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release to OrcaCloud
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases
