name: Build AppImage

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.1.5). The AppImage is built from the current default branch; use this to backfill an AppImage onto an existing git tag that predates the build pipeline.'
        required: false
        default: ''

permissions:
  contents: write   # create/update a GitHub Release and upload the AppImage asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        run: ./scripts/build_appimage.sh

      - name: Publish to GitHub Release
        # v3 (v2 is EOL: Node 20 runtime deprecated). We deliberately do NOT
        # pass name/body: softprops retains the original release info when the
        # tag already has a release, so a manually written release body (with
        # screenshots) is never clobbered — the step only uploads the AppImage
        # asset. When no release exists yet (e.g. a backfill onto an old tag)
        # a release is created with the tag as title and an empty body.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          files: dist/Sutura-x86_64.AppImage
          overwrite_files: true
