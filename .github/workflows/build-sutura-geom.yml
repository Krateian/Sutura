name: Build sutura_geom wheels

# Builds the prebuilt sutura_geom abi3 wheels (rust/sutura-geom, pyo3
# abi3-py311) for the three platforms the install helper
# (scripts/install_sutura_geom.sh) downloads, plus the SHA256SUMS file it
# verifies against:
#   * linux x86_64  -> manylinux_2_28 wheel (cmake + gcc 12 from the image)
#   * linux aarch64 -> manylinux_2_28 wheel, native arm64 runner
#   * macOS         -> universal2 wheel (--target universal2-apple-darwin)
#
# `manifold-csg` compiles the C++ Manifold kernel from source (static link, no
# TBB) and the vendored Geogram Delaunay PSM (C++20). The manylinux_2_28 image
# is used because both C++17 and C++20 are needed; the default manylinux2014
# image's toolchain is too old. `before-script-linux` installs
# cmake/git if the image does not already provide them.
#
# On a published release and on a workflow_dispatch with a `tag` input the
# wheels + sums are uploaded to the matching GitHub Release; the release is
# created by the maintainer's `gh` (a user token), never by this workflow. On
# PRs and plain pushes to main (paths: the crate, the install helper, this file)
# the build + test jobs run but NOTHING is uploaded. The release job
# deliberately passes no name/body to softprops so a manually written release
# body is never clobbered (same pattern as build-appimage.yml / build-macos.yml).
#
# The abi3 tag (cp311-abi3) makes the wheels forward-compatible, which is why
# the test job also imports the wheel on Python 3.14.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'rust/sutura-geom/**'
      - 'scripts/install_sutura_geom.sh'
      - '.github/workflows/build-sutura-geom.yml'
  pull_request:
    paths:
      - 'rust/sutura-geom/**'
      - 'scripts/install_sutura_geom.sh'
      - '.github/workflows/build-sutura-geom.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.7.1). The wheels are built from the current default branch and backfilled onto the existing release.'
        required: false
        default: ''

permissions:
  contents: read   # the release job raises this to write

jobs:
  build:
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: manylinux_2_28
          - name: linux-aarch64
            # Native arm64 runner: the C++ Manifold build must not be
            # cross-compiled (a host x86_64 cmake build produces objects the
            # aarch64 linker rejects).
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: manylinux_2_28
          - name: macos-universal2
            os: macos-latest
            target: universal2-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Configure universal2 C++ build
        if: matrix.name == 'macos-universal2'
        run: echo "CMAKE_OSX_ARCHITECTURES=arm64;x86_64" >> "$GITHUB_ENV"

      - name: Build wheel (maturin, release)
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: 1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            if ! command -v cmake >/dev/null 2>&1; then
              (dnf install -y cmake gcc-c++ git || yum install -y cmake gcc-c++ git)
            fi
          working-directory: rust/sutura-geom
          args: --release --out dist

      - name: Check third-party notices in wheel
        run: |
          W=$(ls rust/sutura-geom/dist/*.whl)
          unzip -l "$W" | grep -q 'THIRD_PARTY.md'
          unzip -l "$W" | grep -q 'third_party/geogram_delaunay_psm/LICENSE'
          unzip -l "$W" | grep -q 'third_party/meshoptimizer/LICENSE'

      - name: Check universal2 extension
        if: matrix.name == 'macos-universal2'
        run: |
          W=$(ls rust/sutura-geom/dist/*.whl)
          rm -rf /tmp/wheelcheck && mkdir -p /tmp/wheelcheck
          unzip -q "$W" 'sutura_geom/*.so' -d /tmp/wheelcheck
          SO=$(find /tmp/wheelcheck -name 'sutura_geom*.so' | head -1)
          lipo -info "$SO"
          lipo -info "$SO" | grep -q 'arm64'
          lipo -info "$SO" | grep -q 'x86_64'

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: rust/sutura-geom/dist/*.whl
          if-no-files-found: error

  test:
    name: Test wheel (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            wheel-artifact: wheel-linux-x86_64
          - name: macos-universal2
            os: macos-latest
            wheel-artifact: wheel-macos-universal2
    steps:
      - uses: actions/checkout@v7

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheel-artifact }}
          path: wheel/

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install wheel + numpy into a 3.11 venv
        run: |
          python3.11 -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet numpy
          ./.venv/bin/pip install --quiet wheel/*.whl

      - name: Smoke tests
        run: |
          ./.venv/bin/python -c "import sutura_geom; print('sutura_geom', sutura_geom.__version__)"
          ./.venv/bin/python tests/test_sutura_geom.py
          ./.venv/bin/python tests/test_sutura_geom_arrangement.py
          ./.venv/bin/python tests/test_splint.py

      - name: Exercise the install helper (SUTURA_GEOM_WHEEL path)
        run: |
          SUTURA_GEOM_WHEEL="$(ls wheel/*.whl | head -1)" scripts/install_sutura_geom.sh ./.venv/bin/python
          ./.venv/bin/python -c "import sutura_geom; print('helper install OK')"

      # The abi3 wheel must also load on a newer interpreter than the abi3
      # baseline (cp311-abi3 -> Python 3.14). Only meaningful on Linux.
      - name: Set up Python 3.14 (abi3 forward-compat check)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: abi3 import check on Python 3.14
        if: runner.os == 'Linux'
        run: |
          python3.14 -m venv .venv314
          ./.venv314/bin/pip install --quiet --upgrade pip
          ./.venv314/bin/pip install --quiet numpy
          ./.venv314/bin/pip install --quiet wheel/*.whl
          ./.venv314/bin/python -c "import sutura_geom; print('abi3 import on Python 3.14 OK')"

  release:
    name: Publish wheels to GitHub Release
    # Only on a `release: published` event, or on a workflow_dispatch that names
    # a tag; PRs and plain pushes to main only build + test (nothing uploaded).
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    # Never publish wheels that did not pass the platform test jobs.
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Write sutura_geom-SHA256SUMS
        run: |
          cd wheels
          sha256sum *.whl > sutura_geom-SHA256SUMS
          cat sutura_geom-SHA256SUMS

      - name: Upload wheels + checksums to GitHub Release
        # v3 (v2 is EOL). Deliberately NO name/body: softprops retains the
        # original release info when the tag already has a release, so a
        # manually written release body is never clobbered - this step only
        # uploads the wheel assets and the checksum file the install helper
        # (scripts/install_sutura_geom.sh) verifies against.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          files: |
            wheels/*.whl
            wheels/sutura_geom-SHA256SUMS
          overwrite_files: true