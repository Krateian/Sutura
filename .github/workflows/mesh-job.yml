name: Mesh job (sharded, owner-only)
on:
  workflow_dispatch:
    inputs:
      base_ref:      { description: 'Side A ref (branch, tag or SHA)', required: true, default: 'main' }
      candidate_ref: { description: 'Side B ref (empty = single-side)', required: false, default: '' }
      sets:          { description: 'Comma list; each entry NAME or NAME@mode (quality_ab|byte|determinism|single_side|bench115|io_parity). Full run: derived264@quality_ab,samples40@quality_ab,bench115@bench115', required: true, default: 'samples40@quality_ab,oracle36@quality_ab' }
      mode:          { description: 'Default mode for entries without @mode: quality_ab | byte | determinism | single_side | bench115 | io_parity', required: true, default: 'quality_ab' }
      env_base:      { description: 'Side A env (unsupported by the harness; candidate side only)', required: false, default: '' }
      env_candidate: { description: 'Side B env, e.g. SUTURA_SI_EXCISE=0', required: false, default: '' }
      shards:        { description: 'Shard count override (per set)', required: false, default: '' }
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Owner-only guard
        run: |
          if [ "$ACTOR" != "Krateian" ]; then echo "::error::mesh job is owner-only"; exit 1; fi
        env: { ACTOR: '${{ github.actor }}' }
      - name: Plan matrix
        id: plan
        env:
          SETS: '${{ inputs.sets }}'
          SHARDS: '${{ inputs.shards }}'
          MODE: '${{ inputs.mode }}'
        run: |
          python3 - <<'PY'
          import json, os, re
          counts={'samples40':8,'oracle36':4,'core150':10,'core_clean':6,'determinism':2,'visual5':5,'derived264':20,'bench115':12}
          modes=('quality_ab','byte','determinism','single_side','bench115','io_parity')
          override=int(os.environ.get('SHARDS') or 0)
          default_mode=os.environ['MODE']
          inc=[]
          for raw in [x.strip() for x in os.environ['SETS'].split(',') if x.strip()]:
              name, _, mode = raw.partition('@')
              mode = mode or default_mode
              if mode not in modes:
                  raise SystemExit('unknown mode: %s' % mode)
              if not re.fullmatch(r'[A-Za-z0-9_]+', name):
                  raise SystemExit('bad set name: %s' % name)
              n=override or counts.get(name,4)
              # bench115 is packed as exactly 12 LPT-balanced chunks and shard k
              # runs chunk k, so the count is fixed at 12.
              if name == 'bench115' and n != 12:
                  raise SystemExit('bench115 shards are fixed at 12 (one per '
                                   'packed chunk); got %d' % n)
              inc += [{'set':name,'mode':mode,'shard':i,'shards':n} for i in range(n)]
          out=json.dumps({'include':inc})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+out+'\n')
          PY
  build-base:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ inputs.base_ref }}' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        run: |
          python -m venv venv
          ./venv/bin/pip install --quiet --upgrade pip maturin==1.15.0
          (cd rust/sutura-geom && ../../venv/bin/maturin build --release --out dist)
      - name: Build Rust CLI
        if: hashFiles('rust/sutura-cli/Cargo.toml') != ''
        working-directory: rust
        run: cargo build --release -p sutura-cli
      - uses: actions/upload-artifact@v4
        with: { name: wheel-base, path: rust/sutura-geom/dist/*.whl, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        if: hashFiles('rust/sutura-cli/Cargo.toml') != ''
        with: { name: sutura-cli-base, path: rust/target/release/sutura, retention-days: 3 }
  build-cand:
    needs: preflight
    if: inputs.candidate_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ inputs.candidate_ref }}' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        run: |
          python -m venv venv
          ./venv/bin/pip install --quiet --upgrade pip maturin==1.15.0
          (cd rust/sutura-geom && ../../venv/bin/maturin build --release --out dist)
      - name: Build Rust CLI
        if: hashFiles('rust/sutura-cli/Cargo.toml') != ''
        working-directory: rust
        run: cargo build --release -p sutura-cli
      - name: Build bridge wheel (if the candidate has sutura-py)
        id: bridge
        run: |
          if [ -f rust/sutura-py/Cargo.toml ]; then
            (cd rust/sutura-py && ../../venv/bin/maturin build --release --out dist)
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "candidate has no sutura-py crate; bridge wheel skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: wheel-cand, path: rust/sutura-geom/dist/*.whl, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        if: hashFiles('rust/sutura-cli/Cargo.toml') != ''
        with: { name: sutura-cli-cand, path: rust/target/release/sutura, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        if: steps.bridge.outputs.present == 'true'
        with: { name: wheel-cand-py, path: rust/sutura-py/dist/*.whl, retention-days: 3 }
  # The harness, the shard/board scripts and the geometry kernel they import
  # come from the workflow's own commit (github.sha), never from base/cand:
  # an older base ref (e.g. a release tag) predates these tools entirely.
  build-tools:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        run: |
          python -m venv venv
          ./venv/bin/pip install --quiet --upgrade pip maturin==1.15.0
          (cd rust/sutura-geom && ../../venv/bin/maturin build --release --out dist)
      - uses: actions/upload-artifact@v4
        with: { name: wheel-tools, path: rust/sutura-geom/dist/*.whl, retention-days: 3 }
  shard:
    needs: [preflight, build-base, build-cand, build-tools]
    if: |
      always() && needs.preflight.result == 'success'
      && needs.build-base.result == 'success'
      && needs.build-tools.result == 'success'
      && (needs.build-cand.result == 'success' || needs.build-cand.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Inputs to env
        run: |
          echo "MODE=$MODE" >> "$GITHUB_ENV"; echo "SET_NAME=$SET_NAME" >> "$GITHUB_ENV"
          echo "SHARD=$SHARD" >> "$GITHUB_ENV"; echo "SHARDS=$SHARDS" >> "$GITHUB_ENV"
          echo "ENV_CAND=$ENV_CAND" >> "$GITHUB_ENV"; echo "ENV_BASE=$ENV_BASE" >> "$GITHUB_ENV"
        env:
          MODE: '${{ matrix.mode }}'
          SET_NAME: '${{ matrix.set }}'
          SHARD: '${{ matrix.shard }}'
          SHARDS: '${{ matrix.shards }}'
          ENV_CAND: '${{ inputs.env_candidate }}'
          ENV_BASE: '${{ inputs.env_base }}'
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - uses: actions/checkout@v7
        with: { path: tools }
      - uses: actions/checkout@v7
        with: { path: base, ref: '${{ inputs.base_ref }}' }
      - uses: actions/checkout@v7
        with: { path: cand, ref: '${{ inputs.candidate_ref || inputs.base_ref }}' }
      - name: Corpus (private repo, secret PAT)
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GATE_CORPUS_REPO || 'Krateian/sutura-gate-corpus' }}
          token: ${{ secrets.GATE_CORPUS_TOKEN }}
          path: corpus
      # bench115 is 6.4 GB; a shard downloads only its own ~250-380 MB chunk
      # from the private repo's release, verifies it, extracts it, and deletes
      # the archive so the 14 GB runner disk never holds the whole corpus.
      # The chunk's own contents ARE the file list: the shard writes its
      # manifest from the extracted files, so no slicing rule lives on the
      # runner and the release needs no extra manifest asset.
      - name: bench115 chunk (private release, secret PAT)
        if: matrix.set == 'bench115'
        env:
          GH_TOKEN: ${{ secrets.GATE_CORPUS_TOKEN }}
          SHARD: ${{ matrix.shard }}
          CORPUS_REPO: ${{ vars.GATE_CORPUS_REPO || 'Krateian/sutura-gate-corpus' }}
        run: |
          set -euo pipefail
          mkdir -p corpus/bench115 corpus/sets
          tmp=$(mktemp -d)
          gh release download benchmark-corpus-v1 -R "$CORPUS_REPO" \
            -p "bench115-chunk-${SHARD}.tar.gz" -p bench115-SHA256SUMS -D "$tmp"
          ( cd "$tmp" && grep " bench115-chunk-${SHARD}.tar.gz\$" bench115-SHA256SUMS | sha256sum -c - )
          tar -xzf "$tmp/bench115-chunk-${SHARD}.tar.gz" -C corpus/bench115
          rm -rf "$tmp"
          # The extracted chunk is the authoritative list for this shard.
          ls corpus/bench115 | grep '\.stl$' | sort > corpus/sets/bench115.txt
          echo "bench115 files staged: $(wc -l < corpus/sets/bench115.txt)"
      - uses: actions/download-artifact@v4
        with: { name: wheel-base, path: wheels-base }
      - uses: actions/download-artifact@v4
        with: { name: wheel-tools, path: wheels-tools }
      - uses: actions/download-artifact@v4
        if: inputs.candidate_ref != ''
        with: { name: wheel-cand, path: wheels-cand }
      - uses: actions/download-artifact@v4
        if: inputs.candidate_ref != ''
        with: { name: sutura-cli-cand, path: cand-bin }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        if: inputs.candidate_ref == ''
        with: { name: sutura-cli-base, path: cand-bin }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        if: inputs.candidate_ref != ''
        with: { name: wheel-cand-py, path: wheels-cand-py }
      - name: Fresh venvs with their own wheel
        run: |
          python3 -m venv tools-venv
          tools-venv/bin/pip install --quiet -r tools/requirements.txt wheels-tools/*.whl
          python3 -m venv base-venv
          base-venv/bin/pip install --quiet -r base/requirements.txt wheels-base/*.whl
          mkdir -p cand-wheels
          if [ -d wheels-cand ]; then cp wheels-cand/*.whl cand-wheels/; else cp wheels-base/*.whl cand-wheels/; fi
          python3 -m venv cand-venv
          cand-venv/bin/pip install --quiet -r cand/requirements.txt cand-wheels/*.whl
          if [ -d wheels-cand-py ]; then
            cand-venv/bin/pip install --quiet wheels-cand-py/*.whl
            cand-venv/bin/python -c "import sutura_core_py"
          fi
      - name: Mark Rust CLI executable
        continue-on-error: true
        if: matrix.mode == 'io_parity'
        run: |
          if [ -f cand-bin/sutura ]; then
            chmod +x cand-bin/sutura
          else
            echo "no Rust CLI artifact; io_parity will use the Python path"
          fi
      - name: Run shard
        run: |
          tools-venv/bin/python tools/scripts/gh_mesh_shard.py
      - name: Sanitized error tail on failure
        if: failure()
        run: |
          [ -f error.json ] && cat error.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with: { name: 'summary-${{ matrix.set }}-${{ matrix.mode }}-${{ matrix.shard }}', path: 'shard-*.json', retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: 'error-${{ matrix.set }}-${{ matrix.mode }}-${{ matrix.shard }}', path: error.json, retention-days: 7, if-no-files-found: ignore }
  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Recompute the plan (a dead shard uploads nothing)
        env: { SETS: '${{ inputs.sets }}', SHARDS: '${{ inputs.shards }}', MODE: '${{ inputs.mode }}' }
        run: |
          python3 - <<'PY' > plan.json
          import json, os, re
          counts={'samples40':8,'oracle36':4,'core150':10,'core_clean':6,'determinism':2,'visual5':5,'derived264':20,'bench115':12}
          modes=('quality_ab','byte','determinism','single_side','bench115','io_parity')
          override=int(os.environ.get('SHARDS') or 0)
          inc=[]
          # Same validation as preflight: this job runs with if: always(), so a
          # silently accepted bad input would surface only as confusing
          # "no summary for shard N" errors instead of the real problem.
          for raw in [x.strip() for x in os.environ['SETS'].split(',') if x.strip()]:
              name, _, mode = raw.partition('@')
              mode = mode or os.environ['MODE']
              if mode not in modes:
                  raise SystemExit('unknown mode: %s' % mode)
              if not re.fullmatch(r'[A-Za-z0-9_]+', name):
                  raise SystemExit('bad set name: %s' % name)
              n=override or counts.get(name,4)
              if name == 'bench115' and n != 12:
                  raise SystemExit('bench115 shards are fixed at 12; got %d' % n)
              inc += [{'set':name,'mode':mode,'shard':i,'shards':n} for i in range(n)]
          print(json.dumps({'include':inc}))
          PY
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: 'summary-*', merge-multiple: true, path: summaries }
      - name: Board
        run: |
          mkdir -p summaries
          python3 scripts/gh_mesh_board.py --plan plan.json summaries > board.md
          cat board.md >> "$GITHUB_STEP_SUMMARY"
      # Upload the board before the verdict check so a failing run still
      # leaves the board to read.
      - uses: actions/upload-artifact@v4
        with: { name: board, path: board.md, retention-days: 7 }
      - name: Verdict check (fails on WORSE/ERROR/MISSING/TIMEOUT)
        run: python3 scripts/gh_mesh_board.py --check --plan plan.json summaries
